<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: "Rubik", "Segoe UI", Arial, sans-serif; width: 240px; margin: 12px; }
    #domain { direction: ltr; font-weight: bold; margin-bottom: 10px; word-break: break-all; }
    button { width: 100%; font-size: 14px; padding: 8px; border: 0; border-radius: 8px; cursor: pointer; margin-bottom: 6px; }
    #toggle { background: #e53935; color: #fff; }
    #toggle.unblock { background: #eee; color: #333; }
    #options { background: #f3f3f3; color: #333; }
  </style>
</head>
<body>
  <div id="domain"></div>
  <button id="toggle" hidden></button>
  <button id="options">ניהול רשימת האתרים</button>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
